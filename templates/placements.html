<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: sans-serif; padding: 40px; background: #f4f7fe; color: #1b2559; }
        .stat-box { display: flex; gap: 20px; margin: 30px 0; }
        .stat-item { background: white; padding: 30px; border-radius: 15px; flex: 1; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .stat-item h2 { color: #4318ff; font-size: 2.5rem; margin: 0; }
        .recruiter-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .recruiter { background: #eee; padding: 10px; border-radius: 5px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>
    <a href="{{ url_for('about') }}">← Back</a>
    <h1>Placement Statistics 2025-26</h1>
    <div class="stat-box">
        <div class="stat-item"><h2>100%</h2><p>Placement Record</p></div>
        <div class="stat-item"><h2>10 LPA</h2><p>Highest Package</p></div>
        <div class="stat-item"><h2>4.19 LPA</h2><p>Average Package</p></div>
    </div>
    <h3>Top Recruiters</h3>
    <div class="recruiter-grid">
        <div class="recruiter">IBM</div>
        <div class="recruiter">Accenture</div>
        <div class="recruiter">EY</div>
        <div class="recruiter">ICICI Bank</div>
        <div class="recruiter">Byju's</div>
        <div class="recruiter">The Times of India</div>
    </div>
</body>
</html>
