{% extends "base.html" %}
{% block content %}
<div class="card" style="height: 80vh; display: flex; flex-direction: column; padding: 0; overflow: hidden; border-radius: 15px;">
    <div style="padding: 20px; border-bottom: 1px solid #eee; background: #4318ff; color: white;">
        <h3 style="margin: 0;">💬 BMS Connect - Staff Lounge</h3>
    </div>
    
    <div id="chat-box" style="flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; background: #f8f9fa;">
        </div>

    <form id="chat-form" style="padding: 20px; display: flex; gap: 10px; background: white; border-top: 1px solid #eee;">
        <input type="text" id="msg-input" placeholder="Share updates with the team..." required 
               style="flex: 1; padding: 15px; border-radius: 30px; border: 1px solid #ddd; outline: none;">
        <button type="submit" class="btn" style="border-radius: 30px; padding: 0 30px; background: #4318ff;">Send</button>
    </form>
</div>

<script>
    function fetchMessages() {
        fetch('/api/chat/messages').then(res => res.json()).then(msgs => {
            const box = document.getElementById('chat-box');
            box.innerHTML = msgs.map(m => `
                <div style="align-self: ${m.user === '{{ session['name'] }}' ? 'flex-end' : 'flex-start'}; 
                            background: ${m.user === '{{ session['name'] }}' ? '#4318ff' : 'white'}; 
                            color: ${m.user === '{{ session['name'] }}' ? 'white' : '#1b2559'}; 
                            padding: 12px 18px; border-radius: 15px; max-width: 70%; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
                    <small style="display: block; font-weight: bold; margin-bottom: 4px; opacity: 0.8;">${m.user}</small>
                    ${m.text}
                </div>
            `).join('');
            box.scrollTop = box.scrollHeight;
        });
    }
    
    document.getElementById('chat-form').onsubmit = (e) => {
        e.preventDefault();
        const input = document.getElementById('msg-input');
        fetch('/api/chat/send', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({text: input.value})
        }).then(() => { input.value = ''; fetchMessages(); });
    };

    setInterval(fetchMessages, 3000);
    fetchMessages();
</script>
{% endblock %}
