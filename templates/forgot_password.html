<!DOCTYPE html>
<html>
<head>
    <title>Reset Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="background: var(--bg); display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div class="card" style="width: 400px; text-align: center;">
        <h2 style="color: var(--p);">Reset Request</h2>
        <p style="color: var(--text-light);">Enter your username to alert HR for a manual reset.</p>
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required style="margin-bottom: 15px;">
            <button type="submit" class="btn" style="width: 100%;">Notify HR Admin</button>
        </form>
        <a href="{{ url_for('login') }}" style="display: block; margin-top: 15px; color: var(--p); text-decoration: none;">Back to Login</a>
    </div>
</body>
</html>
