<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-bg">
    <div class="card" style="width: 400px; z-index: 1; text-align: center;">
        <h2 style="color: var(--p);">Reset Password</h2>
        <p style="color: var(--text-light);">Enter your username to alert HR.</p>
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <button type="submit" class="btn" style="width: 100%;">Send Request to HR</button>
        </form>
        <a href="{{ url_for('login') }}" style="display: block; margin-top: 15px; color: var(--p);">Back to Login</a>
    </div>
</body>
</html>
