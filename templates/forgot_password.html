<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="background: var(--bg); display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div class="card" style="width: 400px; text-align: center;">
        <h2 style="color: var(--p);">Reset Request</h2>
        <p style="color: var(--text-light);">Enter your username. HR will receive a notification.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div style="padding: 10px; margin-bottom: 15px; border-radius: 8px; font-size: 0.9rem;
                          background: {% if category == 'success' %}#d4edda{% else %}#f8d7da{% endif %}; 
                          color: {% if category == 'success' %}#155724{% else %}#721c24{% endif %};
                          border: 1px solid {% if category == 'success' %}#c3e6cb{% else %}#f5c6cb{% endif %};">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required style="margin-bottom: 10px;">
            <button type="submit" class="btn" style="width: 100%;">Notify HR</button>
        </form>
        <a href="{{ url_for('login') }}" style="display: block; margin-top: 15px; color: var(--p); text-decoration: none;">Back to Login</a>
    </div>
</body>
</html>
