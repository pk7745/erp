<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | BMS COLLEGE OF COMMERCE AND MANAGEMENT</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #000000;
            --accent: #800000;
            --bg-body: #ffffff;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            font-family: 'Manrope', sans-serif;
            overflow: hidden;
            perspective: 1000px;
            position: relative;
        }

        /* IMPERIAL WATERMARK */
        .watermark-bg {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vh;
            height: 80vh;
            background: url('https://www.bmsccm.ac.in/img/ll.png') no-repeat center;
            background-size: contain;
            opacity: 0.08;
            z-index: -2;
            pointer-events: none;
        }

        /* 3D CARD SYSTEM */
        .recovery-card {
            background: #ffffff;
            padding: 50px;
            border-radius: 12px;
            border: 4px solid #000;
            box-shadow: 15px 15px 0px #000;
            width: 100%;
            max-width: 420px;
            text-align: center;
            transition: transform 0.1s ease-out;
            transform-style: preserve-3d;
            will-change: transform;
            position: relative;
            z-index: 1;
        }

        .recovery-logo {
            width: 100px;
            height: auto;
            margin-bottom: 20px;
            filter: drop-shadow(4px 4px 0px rgba(0,0,0,0.1));
            transform: translateZ(50px);
        }

        .content-wrap {
            transform: translateZ(40px);
        }

        /* EXISTING FLASH LOGIC STYLED FOR IMPERIAL */
        .alert-box {
            padding: 14px;
            border-radius: 4px;
            margin-bottom: 25px;
            font-size: 0.9rem;
            font-weight: 900;
            border: 2px solid #000;
            text-transform: uppercase;
        }

        .brand-name {
            font-size: 1.25rem;
            font-weight: 950;
            color: #000;
            margin-bottom: 5px;
            letter-spacing: -1px;
            line-height: 1.1;
            text-transform: uppercase;
        }

        .brand-highlight {
            color: var(--accent);
            font-size: 1.45rem;
            display: block;
            margin-top: 5px;
            font-weight: 950;
        }

        input {
            width: 100%;
            padding: 18px;
            margin: 12px 0;
            border: 3px solid #000;
            background: #fff;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 1rem;
            font-family: inherit;
            font-weight: 800;
            outline: none;
            transition: 0.2s;
            text-align: center;
        }

        input:focus {
            box-shadow: 6px 6px 0px #800000;
            transform: translate(-3px, -3px);
        }

        .btn-action {
            width: 100%;
            background: #000;
            color: white !important;
            padding: 20px;
            border: none;
            border-radius: 4px;
            font-weight: 950;
            font-size: 1.2rem;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.2s;
            text-transform: uppercase;
        }

        .btn-action:hover {
            background: #800000;
            transform: translate(-4px, -4px);
            box-shadow: 6px 6px 0px #000;
        }

        .back-link {
            display: block;
            margin-top: 25px;
            color: #000;
            text-decoration: underline;
            text-decoration-thickness: 2px;
            font-size: 0.85rem;
            font-weight: 900;
            text-transform: uppercase;
        }

        .bg-stripe {
            position: absolute;
            width: 100%;
            height: 30vh;
            background: #f0f0f0;
            z-index: -1;
            transform: skewY(-5deg);
        }
    </style>
</head>
<body>

    <div class="watermark-bg"></div>
    <div class="bg-stripe" style="top: -15vh;"></div>
    <div class="bg-stripe" style="bottom: -15vh;"></div>

    <div class="recovery-card">
        <img src="https://www.bmsccm.ac.in/img/ll.png" alt="BMSCCM Logo" class="recovery-logo">

        <div class="content-wrap">
            <div class="brand-name">
                Access <br> 
                <span class="brand-highlight">Recovery Request</span>
            </div>
            <p style="color: #000; margin-bottom: 30px; font-weight: 900; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; opacity: 0.7;">
                Enter username to alert HR
            </p>

            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="alert-box" style="background: {% if category == 'success' %}#d4edda{% else %}#000{% endif %}; color: {% if category == 'success' %}#155724{% else %}#fff{% endif %};">
                    {{ message }}
                  </div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form method="POST">
                <input type="text" name="username" placeholder="USERNAME" required>
                <button type="submit" class="btn-action">Notify HR</button>
            </form>

            <a href="{{ url_for('login') }}" class="back-link">Return to Command Center</a>
        </div>
    </div>

    <script>
        const card = document.querySelector('.recovery-card');
        const motionQuery = window.matchMedia('(prefers-reduced-motion: no-preference)');

        document.addEventListener('mousemove', (e) => {
            if (!motionQuery.matches) return;
            const { clientX, clientY } = e;
            const { innerWidth, innerHeight } = window;
            const xRotation = ((clientY / innerHeight) - 0.5) * -15; 
            const yRotation = ((clientX / innerWidth) - 0.5) * 15;
            card.style.transform = `rotateX(${xRotation}deg) rotateY(${yRotation}deg)`;
        });

        document.addEventListener('mouseleave', () => {
            card.style.transform = `rotateX(0deg) rotateY(0deg)`;
        });
    </script>
</body>
</html>
