{% extends "base.html" %}
{% block content %}
<div style="max-width: 600px; margin: 40px auto;">
    <div class="card" style="text-align: center; padding: 40px; border-top: 5px solid var(--p);">
        <div style="width: 80px; height: 80px; background: var(--p); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; margin: 0 auto 15px auto; font-weight: bold;">
            {{ user.full_name[0] }}
        </div>
        <h2 style="margin: 0;">{{ user.full_name }}</h2>
        <p style="color: var(--text-light); margin-bottom: 20px;">{{ user.role }}</p>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; text-align: left; background: var(--bg); padding: 20px; border-radius: 12px;">
            <div>
                <small style="color: var(--text-light);">Username</small>
                <div style="font-weight: bold;">@{{ user.username }}</div>
            </div>
            <div>
                <small style="color: var(--text-light);">Email</small>
                <div style="font-weight: bold;">{{ user.email }}</div>
            </div>
            <div>
                <small style="color: var(--text-light);">Monthly Salary</small>
                <div style="font-weight: bold;">₹{{ "{:,}".format(user.salary) }}</div>
            </div>
            <div>
                <small style="color: var(--text-light);">Address</small>
                <div style="font-weight: bold;">{{ user.address or 'N/A' }}</div>
            </div>
        </div>
        
        <a href="{{ url_for('dashboard') }}" class="btn" style="margin-top: 25px; display: inline-block; text-decoration: none; width: 100%;">Return to Dashboard</a>
    </div>
</div>
{% endblock %}
