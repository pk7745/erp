{% extends "base.html" %}
{% block content %}
<div style="max-width: 700px; margin: 20px auto;">
    <div class="card" style="padding: 40px; position: relative; overflow: hidden;">
        <div style="position: absolute; top: 0; left: 0; right: 0; height: 100px; background: linear-gradient(90deg, var(--p), #6060f0); opacity: 0.1;"></div>
        
        <div style="text-align: center; position: relative; z-index: 1;">
            <div style="position: relative; width: 120px; height: 120px; margin: 0 auto 15px auto;">
                <img src="{{ url_for('static', filename='uploads/profiles/' + (user.profile_pic or 'default.png')) }}" 
                     onerror="this.src='https://ui-avatars.com/api/?name={{ user.full_name }}&background=4318ff&color=fff'"
                     style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%; border: 4px solid var(--card-bg); box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
                
                <form action="{{ url_for('upload_photo', uid=user.id) }}" method="POST" enctype="multipart/form-data" id="photoForm">
                    <input type="file" name="photo" id="photoInput" style="display:none;" onchange="document.getElementById('photoForm').submit()">
                    <label for="photoInput" style="position: absolute; bottom: 0; right: 0; background: #4318ff; color: white; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 2px solid white; font-size: 0.8rem;">
                        📷
                    </label>
                </form>
            </div>
            
            <h1 style="margin: 0; font-family: 'DM Sans', sans-serif;">{{ user.full_name }}</h1>
            <span class="badge badge-office" style="margin-top: 10px; padding: 5px 15px; font-size: 0.9rem;">Official Profile</span>
        </div>

        <form method="POST" style="margin-top: 40px; display: grid; grid-template-columns: 1fr 1fr; gap: 30px; border-top: 1px solid #eee; padding-top: 30px;">
            <div class="info-group">
                <label style="display: block; color: var(--text-light); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px;">Full Name</label>
                <input type="text" name="full_name" value="{{ user.full_name }}" style="width:100%; border:none; border-bottom:1px solid #ddd; font-weight:700; font-size: 1.1rem; padding: 5px 0;" required>
            </div>
            <div style="grid-column: span 2; text-align: center; margin-top: 10px;">
                <button type="submit" class="btn" style="width: 100%; padding: 12px;">Save Profile Changes</button>
            </div>
        </form>

        <div class="card" style="margin-top: 20px; padding: 20px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
                <h3 style="margin: 0;">📊 Documents & IDs</h3>
                <div style="display: flex; gap: 10px;">
                    <a href="{{ url_for('generate_id', uid=user.id) }}" class="btn" style="padding: 8px 15px; font-size: 0.8rem; background: #1b2559; color: white; text-decoration: none; border-radius: 8px;">
                        🪪 Digital ID Card
                    </a>
                    <a href="{{ url_for('download_salary_certificate') }}" class="btn" style="padding: 8px 15px; font-size: 0.8rem; background: #4318ff; text-decoration: none; border-radius: 8px;">
                        📥 Salary Certificate
                    </a>
                </div>
            </div>
            <div style="height: 300px; width: 100%;">
                <canvas id="salaryChart"></canvas>
            </div>
        </div>

        <div style="margin-top: 20px; text-align: center;">
            <a href="{{ url_for('dashboard') }}" style="text-decoration: none; color: var(--text-light); font-size: 0.9rem;">Return to Workspace</a>
        </div>
    </div>
</div>

{% endblock %}
