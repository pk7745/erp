{% extends "base.html" %}
{% block content %}
<div style="max-width: 700px; margin: 20px auto;">
    <div class="card" style="padding: 40px; position: relative; overflow: hidden;">
        <div style="position: absolute; top: 0; left: 0; right: 0; height: 100px; background: linear-gradient(90deg, var(--p), #6060f0); opacity: 0.1;"></div>
        
        <div style="text-align: center; position: relative; z-index: 1;">
            <div style="width: 100px; height: 100px; background: var(--p); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; margin: 0 auto 15px auto; border: 4px solid var(--card-bg); box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
                {{ user.full_name[0] }}
            </div>
            
            <h1 style="margin: 0; font-family: 'DM Sans', sans-serif;">{{ user.full_name }}</h1>
            <span class="badge badge-office" style="margin-top: 10px; padding: 5px 15px; font-size: 0.9rem;">Official Profile</span>
        </div>

        <form method="POST" style="margin-top: 40px; display: grid; grid-template-columns: 1fr 1fr; gap: 30px; border-top: 1px solid #eee; padding-top: 30px;">
            <div class="info-group">
                <label style="display: block; color: var(--text-light); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px;">Full Name</label>
                <input type="text" name="full_name" value="{{ user.full_name }}" style="width:100%; border:none; border-bottom:1px solid #ddd; font-weight:700; font-size: 1.1rem; padding: 5px 0;" required>
            </div>

            <div class="info-group">
                <label style="display: block; color: var(--text-light); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px;">Designation / Role</label>
                <span style="font-weight: 700; font-size: 1.1rem; color: var(--p); display: block; padding: 5px 0;">{{ user.role }}</span>
                <small style="color: var(--text-light); font-size: 0.7rem;">(Role cannot be changed by user)</small>
            </div>
            
            <div class="info-group">
                <label style="display: block; color: var(--text-light); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px;">Official Email</label>
                <input type="email" name="email" value="{{ user.email }}" style="width:100%; border:none; border-bottom:1px solid #ddd; font-weight:700; font-size: 1.1rem; padding: 5px 0;" required>
            </div>

            <div class="info-group">
                <label style="display: block; color: var(--text-light); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px;">Work Location</label>
                <input type="text" name="address" value="{{ user.address or 'Nexus HQ' }}" style="width:100%; border:none; border-bottom:1px solid #ddd; font-weight:700; font-size: 1.1rem; padding: 5px 0;">
            </div>

            <div class="info-group">
                <label style="display: block; color: var(--text-light); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px;">📅 Date of Birth</label>
                <span style="font-weight: 700; font-size: 1.1rem; display: block; padding: 5px 0; color: #1b2559;">
                    {{ user.dob }}
                </span>
                <small style="color: var(--text-light); font-size: 0.7rem;">(Locked Milestone)</small>
            </div>

            <div class="info-group">
                <label style="display: block; color: var(--text-light); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px;">🗓️ Joining Date</label>
                <span style="font-weight: 700; font-size: 1.1rem; display: block; padding: 5px 0; color: #1b2559;">
                    {{ user.join_date }}
                </span>
                <small style="color: var(--text-light); font-size: 0.7rem;">(Work Anniversary)</small>
            </div>

            <div class="info-group">
                <label style="display: block; color: var(--text-light); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px;">Username</label>
                <span style="font-weight: 700; font-size: 1.1rem; display: block; padding: 5px 0;">@{{ user.username }}</span>
            </div>

            <div class="info-group">
                <label style="display: block; color: var(--text-light); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px;">New Password (Optional)</label>
                <input type="password" name="password" placeholder="Leave blank to keep current" style="width:100%; border:none; border-bottom:1px solid #ddd; font-size: 1.1rem; padding: 5px 0;">
            </div>

            <div style="grid-column: span 2; text-align: center; margin-top: 10px;">
                <button type="submit" class="btn" style="width: 100%; padding: 12px;">Save Profile Changes</button>
            </div>
        </form>

        <div style="margin-top: 20px; text-align: center;">
            <a href="{{ url_for('dashboard') }}" style="text-decoration: none; color: var(--text-light); font-size: 0.9rem;">Return to Workspace</a>
        </div>
    </div>
</div>
{% endblock %}
