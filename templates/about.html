<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>About BMSCCM | Official Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bms-blue: #1b2559; --bms-accent: #4318ff; --bms-gold: #ffb800; }
        body { margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; background: #f4f7fe; color: var(--bms-blue); }
        .hero { background: linear-gradient(rgba(27,37,89,0.8), rgba(27,37,89,0.8)), url('https://www.bmsccm.ac.in/assets/images/slider/banner1.jpg') center/cover; height: 400px; display: flex; align-items: center; justify-content: center; color: white; text-align: center; }
        .nav-card-grid { max-width: 1200px; margin: -60px auto 50px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; padding: 0 20px; }
        .nav-card { background: white; padding: 30px; border-radius: 20px; text-align: center; text-decoration: none; color: inherit; box-shadow: 0 10px 30px rgba(0,0,0,0.1); transition: 0.3s; border-bottom: 4px solid transparent; }
        .nav-card:hover { transform: translateY(-10px); border-color: var(--bms-gold); }
        .nav-card i { font-size: 2.5rem; display: block; margin-bottom: 10px; }
        .section { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .btn-official { background: var(--bms-accent); color: white; padding: 15px 30px; border-radius: 10px; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <header class="hero">
        <div>
            <h1 style="font-size: 3.5rem; margin: 0;">BMSCCM</h1>
            <p style="font-size: 1.2rem; opacity: 0.9;">Excellence, Ethics, Entrepreneurship</p>
        </div>
    </header>

    <div class="nav-card-grid">
        <a href="{{ url_for('admissions') }}" class="nav-card"><i>📝</i><b>Admissions</b></a>
        <a href="{{ url_for('courses') }}" class="nav-card"><i>🎓</i><b>Courses</b></a>
        <a href="{{ url_for('placements') }}" class="nav-card"><i>📈</i><b>Placements</b></a>
        <a href="{{ url_for('campus_life') }}" class="nav-card"><i>🏫</i><b>Campus Life</b></a>
    </div>

    <div class="section" style="text-align: center;">
        <h2>Official Institutional Information</h2>
        <p>BMS College of Commerce and Management is a distinguished institution managed by the BMS Educational Trust.</p>
        <a href="https://www.bmsccm.ac.in/" target="_blank" class="btn-official">Visit Official Website</a>
    </div>
</body>
</html>
