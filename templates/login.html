<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | BMS COLLEGE OF COMMERCE AND MANAGEMENT</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #000000;         /* High Contrast Black */
            --accent: #800000;          /* Imperial Red */
            --bg-body: #ffffff;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            font-family: 'Manrope', sans-serif;
            overflow: hidden;
            perspective: 1000px;
        }

        /* --- NEW: IMPERIAL WATERMARK --- */
        .watermark-bg {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70vh;
            height: 70vh;
            background: url('https://www.bmsccm.ac.in/img/ll.png') no-repeat center;
            background-size: contain;
            opacity: 0.04; 
            z-index: -2;
            pointer-events: none;
        }

        /* --- IMPERIAL 3D CARD --- */
        .login-card {
            background: #ffffff;
            padding: 50px;
            border-radius: 12px;
            border: 4px solid #000;
            box-shadow: 15px 15px 0px #000;
            width: 100%;
            max-width: 420px;
            text-align: center;
            transition: transform 0.1s ease-out;
            transform-style: preserve-3d;
            will-change: transform;
            position: relative;
            z-index: 1;
        }

        /* NEW: Logo inside Login Card */
        .login-logo {
            width: 100px;
            height: auto;
            margin-bottom: 20px;
            filter: drop-shadow(4px 4px 0px rgba(0,0,0,0.1));
            transform: translateZ(50px);
        }

        .brand-name, .login-form, .footer-text {
            transform: translateZ(40px);
        }

        .alert-box {
            background: #000;
            color: #fff !important;
            padding: 14px;
            border-radius: 4px;
            margin-bottom: 25px;
            font-size: 0.9rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border: 2px solid #800000;
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        .brand-name {
            font-size: 1.25rem;
            font-weight: 950;
            color: #000;
            margin-bottom: 5px;
            letter-spacing: -1px;
            line-height: 1.1;
            text-transform: uppercase;
        }

        .brand-highlight {
            color: var(--accent);
            font-size: 1.45rem;
            display: block;
            margin-top: 5px;
            font-weight: 950;
        }

        input {
            width: 100%;
            padding: 18px;
            margin: 12px 0;
            border: 3px solid #000;
            background: #fff;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 1rem;
            font-family: inherit;
            font-weight: 800;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            background: #fff;
            box-shadow: 6px 6px 0px #800000;
            transform: translate(-3px, -3px);
        }

        .btn-login {
            width: 100%;
            background: #000;
            color: white !important;
            padding: 20px;
            border: none;
            border-radius: 4px;
            font-weight: 950;
            font-size: 1.2rem;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-login:hover {
            background: #800000;
            transform: translate(-4px, -4px);
            box-shadow: 6px 6px 0px #000;
        }

        .btn-login:active {
            transform: translate(0, 0);
            box-shadow: none;
        }

        .forgot-link {
            display: block;
            margin-top: 25px;
            color: #000;
            text-decoration: underline;
            text-decoration-thickness: 2px;
            font-size: 0.85rem;
            font-weight: 900;
            text-transform: uppercase;
        }

        .footer-text {
            margin-top: 35px;
            font-size: 0.75rem;
            color: #000;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 950;
            opacity: 0.4;
        }

        .bg-stripe {
            position: absolute;
            width: 100%;
            height: 30vh;
            background: #f0f0f0;
            z-index: -1;
            transform: skewY(-5deg);
        }
    </style>
</head>
<body>

    <div class="watermark-bg"></div>
    <div class="bg-stripe" style="top: -15vh;"></div>
    <div class="bg-stripe" style="bottom: -15vh;"></div>

    <div class="login-card">
        <img src="https://www.bmsccm.ac.in/img/ll.png" alt="BMSCCM Logo" class="login-logo">

        <div class="brand-name">
            BMS COLLEGE OF <br> 
            <span class="brand-highlight">COMMERCE AND MANAGEMENT</span>
        </div>
        <p style="color: #000; margin-bottom: 35px; font-weight: 900; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px;">
            Faculty & Staff Enterprise Portal
        </p>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="alert-box">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" class="login-form">
            <input type="text" name="username" placeholder="USERNAME" required>
            <input type="password" name="password" placeholder="PASSWORD" required>
            <button type="submit" class="btn-login">Sign Into Portal</button>
        </form>

        <a href="{{ url_for('forgot_password') }}" class="forgot-link">Request Access Recovery</a>

        <div class="footer-text">
            SECURE ACCESS &copy; 2026 BMSCCM
        </div>
    </div>

    <script>
        /* 3D INTERACTION LOGIC: RETAINED EXACTLY */
        const card = document.querySelector('.login-card');
        const motionQuery = window.matchMedia('(prefers-reduced-motion: no-preference)');

        document.addEventListener('mousemove', (e) => {
            if (!motionQuery.matches) return;

            const { clientX, clientY } = e;
            const { innerWidth, innerHeight } = window;

            const xRotation = ((clientY / innerHeight) - 0.5) * -15; 
            const yRotation = ((clientX / innerWidth) - 0.5) * 15;

            card.style.transform = `rotateX(${xRotation}deg) rotateY(${yRotation}deg)`;
        });

        document.addEventListener('mouseleave', () => {
            card.style.transform = `rotateX(0deg) rotateY(0deg)`;
        });
    </script>
</body>
</html>
