<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Nexus ERP</title>
    <style>
        :root {
            --primary: #4318ff;
            --navy: #1b2559;
            --error: #ea3a3a;
            --text-gray: #707eae;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f7fe;
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
        }

        .login-card {
            background: white;
            padding: 45px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.04);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        /* ALERT STYLING */
        .alert-box {
            background: #fff5f5;
            color: var(--error);
            padding: 14px;
            border-radius: 14px;
            border: 1px solid #fed7d7;
            margin-bottom: 25px;
            font-size: 0.95rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        .brand-name {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--navy);
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        input {
            width: 100%;
            padding: 16px;
            margin: 12px 0;
            border: 1px solid #e0e5f2;
            border-radius: 14px;
            box-sizing: border-box;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(67, 24, 255, 0.1);
        }

        .btn-login {
            width: 100%;
            background: var(--primary);
            color: white;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.3s;
            box-shadow: 0 10px 20px rgba(67, 24, 255, 0.15);
        }

        .btn-login:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        /* RESTORED FEATURE: FORGOT PASSWORD */
        .forgot-link {
            display: block;
            margin-top: 20px;
            color: var(--primary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: 0.3s;
        }

        .forgot-link:hover {
            text-decoration: underline;
            opacity: 0.8;
        }

        .footer-text {
            margin-top: 25px;
            font-size: 0.8rem;
            color: var(--text-gray);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-name">NEXUS<span style="color: var(--primary);">ERP</span></div>
        <p style="color: var(--text-gray); margin-bottom: 30px;">Sign in to your enterprise workspace.</p>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="alert-box">
                <span>⚠️</span> {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST">
            <input type="text" name="username" placeholder="Username / Nexus ID" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit" class="btn-login">Sign In</button>
        </form>

        <a href="{{ url_for('forgot_password') }}" class="forgot-link">Forgot Password?</a>

        <div class="footer-text">
            Secure Nexus Gateway v2.0
        </div>
    </div>

</body>
</html>
