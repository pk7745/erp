<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-bg">
    <div class="card" style="width: 350px; z-index: 1;">
        {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        {% for category, message in messages %}
            <div class="flash {{ category }}" style="font-size: 13px; padding: 10px;">{{ message }}</div>
        {% endfor %}
    {% endif %}
{% endwith %}
        <h2 style="text-align: center; color: var(--p);">Nexus Login</h2>
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit" class="btn" style="width: 100%;">Sign In</button>
        </form>
        <div style="text-align: center; margin-top: 15px;">
            <a href="{{ url_for('forgot_password') }}" style="color: var(--text-light); font-size: 14px;">Forgot Password?</a>
        </div>
    </div>
</body>

</html>
