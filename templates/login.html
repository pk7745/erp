<!DOCTYPE html>
<html>
<head>
    <title>Nexus Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="background: var(--bg); display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div class="card" style="width: 350px; position: relative;">
        
        <div style="margin-bottom: 20px;">
            <a href="{{ url_for('home') }}" style="text-decoration: none; color: #4318ff; font-size: 0.9rem; display: flex; align-items: center; gap: 5px;">
                ← Back to Home
            </a>
        </div>

        <h2 style="text-align: center; color: var(--p);">Nexus ERP</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    {% for category, message in messages %}
      <div class="alert alert-{{ category }}">
        {{ message }}
      </div>
    {% endfor %}
  {% endif %}
{% endwith %}

<style>
    .alert {
        padding: 15px;
        margin-bottom: 20px;
        border: 1px solid transparent;
        border-radius: 12px;
        font-weight: 600;
        text-align: center;
        animation: shake 0.5s ease-in-out;
    }
    .alert-danger {
        color: #721c24;
        background-color: #f8d7da;
        border-color: #f5c6cb;
    }
    
    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-5px); }
        75% { transform: translateX(5px); }
    }
</style>
        
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required style="margin-bottom: 10px;">
            <input type="password" name="password" placeholder="Password" required style="margin-bottom: 10px;">
            <button type="submit" class="btn" style="width: 100%;">Login</button>
        </form>

        <div style="text-align: center; margin-top: 15px;">
            <a href="{{ url_for('forgot_password') }}" style="color: var(--text-light); text-decoration: none;">Forgot Password?</a>
        </div>
    </div>
</body>
</html>
