<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | BMS COLLEGE OF COMMERCE AND MANAGEMENT</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Manrope:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #000000;
            --imp-crimson: #800000;
            --imp-crimson-bright: #be123c;
            --imp-gold: #D4AF37;
            --bg-body: #ffffff;
            --grain: url("https://www.transparenttextures.com/patterns/carbon-fibre.png");
            --shadow-neo: 15px 15px 0px #000000;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            font-family: 'Plus Jakarta Sans', 'Manrope', sans-serif;
            overflow: hidden;
            perspective: 1500px;
            position: relative;
        }

        /* --- REFINED: IMPERIAL WATERMARK --- */
        .watermark-bg {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85vh;
            height: 85vh;
            background: url('https://www.bmsccm.ac.in/img/ll.png') no-repeat center;
            background-size: contain;
            opacity: 0.05;
            z-index: -2;
            pointer-events: none;
            filter: grayscale(100%);
        }

        /* --- HYPER-REAL NEOTERIC CARD --- */
        .login-card {
            background: #ffffff;
            padding: 55px;
            border-radius: 16px;
            border: 5px solid #000;
            box-shadow: var(--shadow-neo);
            width: 100%;
            max-width: 440px;
            text-align: center;
            transition: transform 0.1s ease-out;
            transform-style: preserve-3d;
            will-change: transform;
            position: relative;
            z-index: 1;
        }

        /* Subtle Grain Overlay on Card */
        .login-card::after {
            content: ""; position: absolute; inset: 0; 
            background-image: var(--grain); opacity: 0.03; 
            pointer-events: none; border-radius: 11px;
        }

        .login-logo {
            width: 110px;
            height: auto;
            margin-bottom: 25px;
            filter: drop-shadow(6px 6px 0px rgba(0,0,0,0.15));
            transform: translateZ(60px);
        }

        .brand-name, .login-form, .footer-text, .portal-label {
            transform: translateZ(40px);
        }

        /* RETAINED: Flash Alert System */
        .alert-box {
            background: #000;
            color: #fff !important;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 30px;
            font-size: 0.9rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            border: 3px solid var(--imp-crimson);
            box-shadow: 5px 5px 0px var(--imp-crimson);
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        .brand-name {
            font-size: 1.35rem;
            font-weight: 900;
            color: #000;
            margin-bottom: 8px;
            letter-spacing: -1.5px;
            line-height: 1.1;
            text-transform: uppercase;
        }

        .brand-highlight {
            color: var(--imp-crimson);
            font-size: 1.55rem;
            display: block;
            margin-top: 5px;
            font-weight: 950;
            background: linear-gradient(180deg, var(--imp-crimson), #4a0000);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .portal-label {
            color: #000; 
            margin-bottom: 40px; 
            font-weight: 800; 
            font-size: 0.8rem; 
            text-transform: uppercase; 
            letter-spacing: 2px;
            opacity: 0.8;
        }

        input {
            width: 100%;
            padding: 20px;
            margin: 14px 0;
            border: 4px solid #000;
            background: #fff;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            font-family: inherit;
            font-weight: 800;
            outline: none;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        input:focus {
            box-shadow: 8px 8px 0px var(--imp-crimson);
            transform: translate(-4px, -4px);
            border-color: var(--imp-crimson);
        }

        /* RETAINED: Login Button Logic */
        .btn-login {
            width: 100%;
            background: #000;
            color: white !important;
            padding: 22px;
            border: none;
            border-radius: 8px;
            font-weight: 900;
            font-size: 1.2rem;
            cursor: pointer;
            margin-top: 25px;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
        }

        .btn-login:hover {
            background: var(--imp-crimson);
            transform: translate(-6px, -6px);
            box-shadow: 10px 10px 0px #000;
        }

        .btn-login:active {
            transform: translate(0, 0);
            box-shadow: none;
        }

        .forgot-link {
            display: inline-block;
            margin-top: 30px;
            color: #000;
            text-decoration: none;
            border-bottom: 3px solid var(--imp-crimson);
            padding-bottom: 2px;
            font-size: 0.85rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.2s;
        }

        .forgot-link:hover {
            background: var(--imp-crimson);
            color: #fff;
            padding: 5px 10px;
            border-radius: 4px;
        }

        .footer-text {
            margin-top: 45px;
            font-size: 0.7rem;
            color: #000;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 900;
            opacity: 0.3;
        }

        /* Background Dynamic Elements */
        .bg-stripe {
            position: absolute;
            width: 100%;
            height: 35vh;
            background: rgba(0,0,0,0.02);
            z-index: -1;
            transform: skewY(-6deg);
            border-top: 2px solid rgba(0,0,0,0.05);
            border-bottom: 2px solid rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

    <div class="watermark-bg"></div>

    <div class="bg-stripe" style="top: -10vh;"></div>
    <div class="bg-stripe" style="bottom: -10vh;"></div>

    <div class="login-card">
        <img src="https://www.bmsccm.ac.in/img/ll.png" alt="BMSCCM Logo" class="login-logo">

        <div class="brand-name">
            BMS COLLEGE OF <br> 
            <span class="brand-highlight">COMMERCE AND MANAGEMENT</span>
        </div>
        
        <p class="portal-label">
            Faculty & Staff Enterprise Portal
        </p>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="alert-box">
                <span style="font-size: 1.2rem;">⚠️</span>
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" class="login-form">
            <input type="text" name="username" placeholder="IDENTIFICATION ID" required autocomplete="username">
            <input type="password" name="password" placeholder="SECURITY ACCESS KEY" required autocomplete="current-password">
            <button type="submit" class="btn-login">Authorize Entry</button>
        </form>

        <a href="{{ url_for('forgot_password') }}" class="forgot-link">Request Access Recovery</a>

        <div class="footer-text">
            ENCRYPTED ACCESS &copy; 2026 BMSCCM COMMAND
        </div>
    </div>

    <script>
        // RETAINED: 3D Mouse Motion Logic
        const card = document.querySelector('.login-card');
        const motionQuery = window.matchMedia('(prefers-reduced-motion: no-preference)');

        document.addEventListener('mousemove', (e) => {
            if (!motionQuery.matches) return;

            const { clientX, clientY } = e;
            const { innerWidth, innerHeight } = window;

            // Refined rotation degrees for a smoother "premium" feel
            const xRotation = ((clientY / innerHeight) - 0.5) * -12; 
            const yRotation = ((clientX / innerWidth) - 0.5) * 12;

            card.style.transform = `rotateX(${xRotation}deg) rotateY(${yRotation}deg)`;
        });

        document.addEventListener('mouseleave', () => {
            card.style.transform = `rotateX(0deg) rotateY(0deg)`;
            card.style.transition = `transform 0.6s cubic-bezier(0.23, 1, 0.32, 1)`;
        });

        document.addEventListener('mouseenter', () => {
            card.style.transition = `transform 0.1s ease-out`;
        });
    </script>
</body>
</html>
